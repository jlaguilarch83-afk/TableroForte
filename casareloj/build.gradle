plugins {
    id 'com.android.application'
}

// Mi Casa en el reloj (Galaxy Watch): tarjetas por cuarto y la casita 3D
android {
    namespace 'mx.micasa.reloj'
    compileSdk 34

    defaultConfig {
        applicationId 'mx.micasa.reloj'
        minSdk 30
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    signingConfigs {
        debug {
            storeFile file('../app/forte.jks')
            storePassword 'tablero-forte'
            keyAlias 'forte'
            keyPassword 'tablero-forte'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
