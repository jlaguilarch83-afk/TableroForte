plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.forte.tablero'
    compileSdk 34

    defaultConfig {
        applicationId 'mx.forte.tablero'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '3.0'
    }

    // Llave fija: así cada versión nueva se instala encima de la anterior
    signingConfigs {
        debug {
            storeFile file('forte.jks')
            storePassword 'tablero-forte'
            keyAlias 'forte'
            keyPassword 'tablero-forte'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // comunicación con el reloj (Wear OS)
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
}
