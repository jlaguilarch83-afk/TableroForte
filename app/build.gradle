plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.forte.tablero'
    compileSdk 34

    defaultConfig {
        applicationId 'mx.forte.tablero'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.4.0'
}
