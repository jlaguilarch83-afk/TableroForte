plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.forte.tablero'
    compileSdk 34

    defaultConfig {
        applicationId 'mx.forte.tablero'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.3'
    }

    // Llave fija: así cada versión nueva se instala encima de la anterior
    signingConfigs {
        debug {
            storeFile file('forte.jks')
            storePassword 'tablero-forte'
            keyAlias 'forte'
            keyPassword 'tablero-forte'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.4.0'
}
