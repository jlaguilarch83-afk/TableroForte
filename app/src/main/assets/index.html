<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tablero Forte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..125,300..800&family=Orbitron:wght@500;700;900&family=Oswald:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!--CUERPO-->
<div id="stage">
  <div id="skinHost" hidden></div>
  <canvas id="cv" hidden></canvas>
</div>

<div class="top l"><button class="chip" id="chip" type="button" data-k="sim"><i></i><span id="chipTxt">Simulación</span></button></div>
<div class="top r">
  <div id="musicBar">
    <button class="ibtn" id="mPrev" type="button" aria-label="Canción anterior"></button>
    <button class="ibtn" id="mPlay" type="button" aria-label="Reproducir o pausar"></button>
    <button class="ibtn" id="mNext" type="button" aria-label="Siguiente canción"></button>
  </div>
  <button class="ibtn" id="btnShot" type="button" aria-label="Tomar foto" hidden></button>
  <button class="ibtn" id="btnMenu" type="button" aria-label="Menú"></button>
</div>
<div id="valetTag" hidden></div>
<div id="banner" role="status" hidden></div>

<div id="camBox" hidden><video id="camVid" autoplay muted playsinline></video><span id="recDot" hidden>REC</span></div>
<div id="flash" hidden></div>

<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-label="Menú">
  <div class="dhead">
    <button type="button" id="dBack" hidden>‹ Menú</button>
    <h2 id="dTitle">Menú</h2>
    <button type="button" id="dClose">Cerrar</button>
  </div>
  <div id="dBody"></div>
</aside>

<div id="welcome" hidden><canvas id="wcv"></canvas></div>

<script src="core.js"></script>
<script src="skins.js"></script>
<script src="pano.js"></script>
<script src="tesla.js"></script>
<script src="variants.js"></script>
<script src="ui.js"></script>
<script src="extras.js"></script>
<script src="nav.js"></script>
<script src="vision.js"></script>
<script src="mas.js"></script>
<!--/CUERPO-->
</body>
</html>
