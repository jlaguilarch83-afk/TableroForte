plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.forte.reloj'
    compileSdk 34

    defaultConfig {
        // mismo identificador y llave que la app del teléfono: así se pueden hablar
        applicationId 'mx.forte.tablero'
        minSdk 30
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }

    signingConfigs {
        debug {
            storeFile file('../app/forte.jks')
            storePassword 'tablero-forte'
            keyAlias 'forte'
            keyPassword 'tablero-forte'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    implementation 'androidx.wear.tiles:tiles:1.2.0'
    implementation 'androidx.wear.protolayout:protolayout:1.0.0'
    implementation 'com.google.guava:guava:32.1.3-android'
}
