name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar kit de Android
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Usando $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
      - name: Compilar
        run: |
          set -o pipefail
          chmod +x gradlew
          if ! ./gradlew :app:assembleDebug :wear:assembleDebug --no-daemon 2>&1 | tee build.log; then
            grep -E "error:|e: |What went wrong|Could not|FAILED|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: TableroForte-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TableroForte.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk TableroForteReloj.apk
          gh release create "v2.7.${{ github.run_number }}" TableroForte.apk TableroForteReloj.apk \
            --title "Tablero Forte v2.7.${{ github.run_number }}" \
            --notes "TableroForte.apk va en el teléfono. TableroForteReloj.apk va en el reloj (Galaxy Watch)." --latest
